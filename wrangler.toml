name = "callsun-b2b"
main = "src/worker.js"
compatibility_date = "2026-07-23"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]
workers_dev = true

# 正式域名路由（2026-08-11 添加；www 2026-08-13 重新绑定——原绑定+DNS 被删导致打不开）
routes = [
  { pattern = "callsunenergy.com", custom_domain = true },
  { pattern = "www.callsunenergy.com", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "404-page"

# 缓存策略（2026-08-16 加）：静态资源长缓存走 public/_headers（Workers Static Assets 支持）
# HTML 不缓存（即时更新）；图片 1 天；带 hash 的 css/js/字体 immutable 1 年

# 询盘 + CRM 数据库（部署前需创建：wrangler d1 create callsun-b2b-db）
# 本地模拟：wrangler dev --local 自动用本地 sqlite
[[d1_databases]]
binding = "DB"
database_name = "callsun-b2b-db"
database_id = "a5f83f6d-e3f9-4d2c-8945-b7f7188ac805"
migrations_dir = "migrations"

[observability]
enabled = true

# 定时任务：每天 01:00 UTC = 09:00 北京时间，推送待跟进清单到飞书群
[triggers]
crons = ["0 1 * * *"]
