# Callsun B2B — Decap CMS 配置（2026-08-11 重建，仅博客）
# 认证复用 jinko-cms-oauth（通用 GitHub OAuth 代理，不影响旧项目）
backend:
  name: github
  repo: youjunhui-sky/callsun-b2b
  branch: main
  base_url: https://jinko-cms-oauth.youjh120608.workers.dev
  auth_endpoint: oauth/auth

media_folder: "public/blog"
public_folder: "/blog"

site_url: https://callsunenergy.com
display_url: https://callsunenergy.com
logo_url: /logo.png
locale: "en"
publish_mode: editorial_workflow

# 注意：字段必须与 src/content/config.ts 的 news schema 严格一致，
# 多出的字段会导致 Astro build 时 content collection 校验失败
collections:
  - name: "news"
    label: "📰 Blog"
    folder: "src/content/news"
    create: true
    delete: true
    format: "frontmatter"
    extension: "md"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "publishDate", label: "Publish Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "updatedDate", label: "Updated Date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { name: "author", label: "Author", widget: "string", default: "Callsun" }
      - { name: "cover", label: "Cover Image", widget: "image", required: false, hint: "Upload to public/blog/ — e.g. 2026-08-11-my-post.webp" }
      - { name: "coverAlt", label: "Cover Image Alt", widget: "string", required: false }
      - { name: "category", label: "Category", widget: "select", options: ["Technical", "Product", "Industry", "Press", "Sustainability"] }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false }
      - { name: "ctaTitle", label: "CTA Title", widget: "string", required: false }
      - { name: "ctaDescription", label: "CTA Description", widget: "text", required: false }
      - { name: "ctaLabel", label: "CTA Label", widget: "string", required: false }
      - { name: "ctaHref", label: "CTA URL", widget: "string", required: false }
      - { name: "body", label: "Body", widget: "markdown" }
