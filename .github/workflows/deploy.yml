name: Deploy callsun-b2b to Cloudflare

# 触发：main 分支 push（CMS 发布内容合入 main 后自动上线）
# 需要 repository secrets：
#   CLOUDFLARE_API_TOKEN  — 来自 ~/.cloudflare-token.env（Edit zone DNS + Workers）
#   CLOUDFLARE_ACCOUNT_ID — 90b09e9278970f131690e99f858ac7c6

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy Worker + static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
